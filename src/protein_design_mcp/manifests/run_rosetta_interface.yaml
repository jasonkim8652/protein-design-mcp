name: run_rosetta_interface
category: scoring
composite: false
timeout_s: 1800

engine:
  repo: pyrosetta
  # /opt/pyrosetta_wheels/pyrosetta-2017-cp312-cp312-linux_x86_64.whl (the
  # only wheel this project shipped a dedicated env for) is BROKEN -- 1.8GB,
  # 24,335 entries, ZERO compiled `.so` extensions among them, so
  # `import pyrosetta` can never succeed from it (PyRosetta's Python layer is
  # a thin wrapper around compiled `pyrosetta.rosetta` bindings). Do not
  # revert to it; a dedicated `pyrosetta` env built from that wheel cannot be
  # fixed by any environment-configuration change.
  #
  # A genuinely working PyRosetta install already exists on this host inside
  # `~/.conda/envs/BindCraft` (python 3.10, `import pyrosetta` plus
  # `InterfaceAnalyzerMover`/`DockingPartners` CONFIRMED LIVE, 2026-09-22) --
  # pointed at here READ-ONLY, the same way every other engine in this
  # server points at its host env, and BindCraft itself is left completely
  # untouched (it is excluded from this server by design, spec §3.3,
  # gradient-based hallucination -- that exclusion has no bearing on reusing
  # the PyRosetta install inside it; this tool never imports anything
  # BindCraft-specific).
  #
  # PyRosetta's own licence prohibits redistribution -- this is why it is
  # mounted at runtime from the host, exactly like every other conda
  # `prefix:` env, and never baked into any image layer. That fact belongs
  # here and in the wave report, not in this manifest's summary/description
  # or the generated doc, which a model reads and cannot act on a licensing
  # constraint from.
  prefix: /home/jk661/.conda/envs/BindCraft
  entry: ["python", "/app/scripts/engines/rosetta_interface.py"]
  # No `mounts:` -- CONFIRMED live, 2026-09-22:
  # `python -m protein_design_mcp.mounts /home/jk661/.conda/envs/BindCraft
  # pyrosetta` returns an EMPTY list. Unlike the broken `pyrosetta` env this
  # replaces, this discovery command could actually be run against a working
  # `import pyrosetta` this time.

requires:
  gpu: false

summary: >-
  Physics-based protein-protein interface analysis with PyRosetta's
  InterfaceAnalyzerMover: binding energy (dG), buried surface area (dSASA),
  Lawrence-Coleman shape complementarity, and interface hydrogen-bond
  counts. CONFIRMED LIVE end to end through ServerApp.call_tool, 2026-09-22
  -- see the doc's "Verification status" section for the environment this
  runs from and why.

doc: |
  ## What this is
  PyRosetta's `InterfaceAnalyzerMover` run over an existing protein-protein
  complex structure: it separates the named partners, optionally repacks
  each side, and reports the Rosetta all-atom energy difference between
  bound and separated states (`dG`), the buried solvent-accessible surface
  area (`dSASA`), the Lawrence & Coleman shape-complementarity statistic
  (`sc_value`, 0-1, higher is a tighter geometric fit), and interface
  hydrogen-bond counts.

  ## Verification status
  This tool's own `engine.prefix` env, `~/.conda/envs/BindCraft`, is NOT a
  dedicated PyRosetta install -- it is an existing environment this server
  excludes as a *tool* (BindCraft itself is out of scope by design, spec
  §3.3, gradient-based hallucination) but reuses here, READ-ONLY, purely for
  the working `pyrosetta` package installed inside it. It is never modified
  by this project. (An earlier `/opt/pyrosetta_wheels/pyrosetta-2017-cp312-cp312-linux_x86_64.whl`-based
  env was tried first and is broken -- 1.8GB, zero compiled `.so` files
  among its 24,335 entries, so `import pyrosetta` fails immediately with
  `ModuleNotFoundError: No module named 'pyrosetta.rosetta'`. Do not use it;
  no environment configuration fixes a wheel missing its compiled
  extension.)

  CONFIRMED LIVE, 2026-09-22, running this tool's actual committed wrapper
  script (`scripts/engines/rosetta_interface.py`, not a hand-typed snippet)
  through `~/.conda/envs/BindCraft`'s interpreter over
  `tests/fixtures/test_pdbs/1BRS.pdb` (the barnase-barstar complex), chains
  `A_D`: `dG=210.29`, `dSASA=1573.97`, `shape_complementarity=0.72` (a
  physically sane Lawrence-Coleman value for a real, tight protein-protein
  interface), `interface_hbonds=13`, `delta_unsat_hbonds=10`,
  `num_interface_residues=67`, `packstat=0.56`. Turning `pack_separated`
  off on the same complex (also confirmed live, same run) moves `dG` from
  +210.29 to -54.20 -- confirming this doc's own claim about why that
  default matters, not just asserting it.

  ## `interface` -- Rosetta's own docking-partner notation, not reinvented
  `"A_B"` for a simple two-chain interface, or `"AB_HL"` for a multi-chain
  group on either side (e.g. an antibody's heavy+light chains as one side).
  This is `DockingPartners.docking_partners_from_string`'s own format,
  passed straight through rather than translated into a different
  convention -- an underscore separates the two sides, and each side is one
  or more concatenated single-letter chain IDs.

  ## Why `interface` is required and never inferred
  Exactly like `run_prodigy`'s `chain_a`/`chain_b`: which chains are one
  "side" of the interface and which are the other is the caller's decision
  and changes the physical question being asked. A target-only pose with no
  `interface` supplied would have nothing to separate at all.

  ## Repacking parameters -- these change the number, not just the speed
  `pack_separated` (default true, this tool's own default -- matches the
  legacy `pyrosetta_runner.py` PyRosetta wrapper this project already
  carried) repacks each partner's side chains AFTER separation, which is
  what makes `dG` reflect each partner's own relaxed, unbound state rather
  than the bound conformation frozen in place -- turning it off is faster
  but systematically biases `dG` more favourable (bound-state side chains
  are not optimal for the separated state). `pack_input` (default false)
  additionally repacks the input bound complex before scoring it -- off by
  default because it can change the very geometry `sc_value`/`dSASA`
  describe. `pack_rounds` (default 1, Rosetta's OWN documented default per
  `set_pack_rounds`'s docstring: "Default is 1, but that certainly may not
  be enough...") controls how many packing rounds run when either repacking
  flag is on.

  ## What you must supply
  `complex_pdb`: a structure file with both partners. `interface`: which
  chains are on which side (see above) -- no default, must be stated.

  ## What you get back
  `dG` (Rosetta energy units, bound minus separated -- more negative is a
  more favourable interface), `dSASA` (buried surface area, Å²),
  `shape_complementarity` (Lawrence-Coleman `sc_value`, 0-1), a plain
  interface hydrogen-bond count (`interface_hbonds`) and the count of
  UNSATISFIED interface hydrogen bonds after burial (`delta_unsat_hbonds`,
  a common red flag when high), `packstat` (Rosetta's packing-quality
  statistic, when `compute_packstat` was left on), and `num_interface_residues`.

  ## When to use this instead of the alternatives
  - `run_prodigy` is a linear-regression estimate from contact counts alone
    -- much faster, needs no repacking, but calibrated on natural complexes
    and known to mis-rank de novo designs. This tool gives a full
    all-atom-energy decomposition instead, at much higher CPU cost -- prefer
    `run_prodigy` for a fast first pass over many candidates and this tool
    when you need the full energy breakdown (or `run_prodigy`'s natural-
    complex calibration is a specific concern) for a shortlist.
  - `run_ipsae` and a co-folding tool's own `iptm` measure predictor
    CONFIDENCE, not physical interface quality -- a different question from
    either of the above.

schema:
  complex_pdb:
    type: string
    format: path
    pattern: '\.(pdb|cif|ent)$'
    required: true
    description: Path to a structure file containing both interface partners.
    example: complex.pdb
  interface:
    type: string
    pattern: '^[A-Za-z0-9]+_[A-Za-z0-9]+$'
    required: true
    description: >-
      Which chains form each side of the interface, in Rosetta's own
      docking-partner notation: one or more concatenated single-letter
      chain IDs, an underscore, then the other side's chain IDs -- e.g.
      "A_B" for a simple two-chain interface, "AB_HL" for a multi-chain
      group (e.g. an antibody's two chains) versus another. Never inferred
      -- which chains are which side is the caller's decision.
    example: A_B
  score_function:
    type: string
    pattern: '^[a-zA-Z0-9_]+$'
    default: ref2015
    description: >-
      Name of the Rosetta all-atom score function to weight the energy
      calculation with (passed to pyrosetta.create_score_function). ref2015
      is Rosetta's current standard full-atom score function and this
      tool's default; use a different name only if you specifically need a
      non-standard weight set installed in this Rosetta database.
    example: ref2015
  pack_separated:
    type: boolean
    default: true
    description: >-
      Repack each partner's side chains AFTER separating them, before
      scoring the separated state. This tool's own default (matching this
      project's existing legacy PyRosetta wrapper) -- without it, dG is
      biased favourable because the separated partners keep their BOUND
      side-chain conformations instead of relaxing to their own optimum.
    example: true
  pack_input:
    type: boolean
    default: false
    description: >-
      Additionally repack the input BOUND complex before analysis, on top
      of pack_separated. Off by default -- it can change the bound-state
      geometry that dSASA/shape_complementarity describe, which is usually
      not what you want when scoring a structure you already trust.
    example: false
  pack_rounds:
    type: integer
    minimum: 1
    maximum: 20
    default: 1
    description: >-
      How many packing rounds run when pack_separated and/or pack_input is
      on; ignored if both are false. 1 is Rosetta's own documented default
      (its docstring notes 1 round "certainly may not be enough" for a
      thorough repack) -- raise this for a more thorough (and slower)
      repack on a case where the default's single round leaves an
      obviously unconverged side-chain arrangement.
    example: 1
  compute_packstat:
    type: boolean
    default: true
    description: >-
      Whether to compute Rosetta's packstat statistic (a measure of
      how well side chains at the interface are packed). Stochastic and
      adds meaningful runtime; this tool's default is true since packstat
      is one of this tool's returned fields -- set false to skip it and
      speed up the call when you only need dG/dSASA/shape_complementarity.
    example: true
  compute_interface_sc:
    type: boolean
    default: true
    description: >-
      Whether to compute the Lawrence-Coleman shape-complementarity
      statistic (this tool's shape_complementarity output). This tool's
      default is true since it is one of this tool's headline fields; set
      false only to skip its cost when you specifically do not need it.
    example: true
