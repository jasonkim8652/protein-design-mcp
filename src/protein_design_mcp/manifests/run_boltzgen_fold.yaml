name: run_boltzgen_fold
category: structure_prediction
composite: false
timeout_s: 1800

engine:
  repo: boltzgen
  prefix: /opt/conda/envs/boltzgen
  entry:
  - python
  - /app/scripts/engines/boltzgen_fold.py
  stage:
  - generated_files
  env_vars:
    HF_HOME: /opt/models/huggingface

requires:
  gpu: true

outputs:
  - name: chain_mapping_json
    pattern: "chain_mapping.json"
    optional: true
    description: >-
      External mode only: input_to_generated and input_to_refolded map caller
      chain IDs to actual native output chain IDs. Binder-alone refolds omit targets.
  - name: generated_designs
    pattern: "generated_files/*.[cn][ip][fz]"
    description: Native paired design CIF and metadata, including converted external input; pass matching pairs to analyze.
    multiple: true
  - name: design_spec_yaml
    pattern: "design_spec.yaml"
    description: Portable concrete sequence specification for the downstream folding and analysis CLI validation.
  - name: refolded_structures
    # BoltzGen names the directory after the STEP: `folding` writes
    # refold_cif/, `design_folding` writes refold_design_cif/. One
    # tool with two modes has to collect both.
    pattern: "generated_files/refold*_cif/*.cif"
    description: >-
      One refolded mmCIF per design (the highest-confidence of
      diffusion_samples internal samples, by 0.8*iptm + 0.2*ptm -- the same
      selection BoltzGen's own writer uses). pLDDT is in the B-factor column.
    multiple: true
  - name: refold_metrics
    # Same per-step naming as refolded_structures above.
    pattern: "generated_files/fold_out*_npz/*.npz"
    description: >-
      Per-design confidence metrics for EVERY internal sample (arrays of
      length diffusion_samples), not just the best one -- read this if you
      want the full spread rather than only the headline numbers this
      tool's own payload reports.
    multiple: true

summary: >-
  Refold designed proteins with BoltzGen's MSA-free confidence model,
  either with the target (with_target=true) or alone (false). Accepts
  native design_spec + complete paired CIF/NPZ generated_files, or an
  external PDB/CIF backbone (including gzip) + explicit design_chains +
  designed_sequences mapping. External inputs are
  converted by BoltzGen's native parser and writer without inference;
  the same folding model then predicts coordinates and confidence.
  Returns native generated_designs and design_spec_yaml for analyze,
  refolded structures and sample confidence metrics.

doc: |
  ## What this is
  BoltzGen's `folding` pipeline step
  (`boltzgen.task.predict.predict.Predict` over `fold.yaml`, writer
  `FoldingWriter`), run in isolation via `boltzgen run <design_spec>
  --steps folding`. Refolds each design WITH its target chain(s) present
  (unlike `run_boltzgen_fold` with `with_target: false`, which refolds the design ALONE) using
  BoltzGen's own confidence model -- the same architecture family as
  Boltz-2, but this is BoltzGen's own weights, not a call to `run_boltz`.
  Reports the interface confidence metrics that make this the step
  everything downstream (`run_boltzgen_analyze`, `run_boltzgen_filter`)
  actually ranks on.

  ## `--protocol` has no effect on this step for the six protocols that
  matter here (verified empirically the same way as `run_boltzgen_design`:
  diffing `boltzgen configure --steps folding`'s resolved `fold.yaml` shows
  every protocol identical except `protein-redesign`, which sets
  `data.design_mask_templates=true` -- a redesign-specific mode this tool
  does not support). `protocol` is not exposed here for the same reason it
  is not exposed on `run_boltzgen_design`: a parameter with no effect on
  the path this tool actually takes would be misleading to document as a
  real choice.

  ## When to use this instead of the alternatives
  - `run_boltzgen_fold` with `with_target: false` refolds the design ALONE, target absent -- a
    self-consistency check on the design's own shape, not an interface
    confidence estimate. Run both if you want each design's `analyze` step
    (`run_boltzgen_analyze`) to include `designfolding-*` columns.
  - `run_chai1`/`run_boltz` are general-purpose
    structure predictors that take an MSA; this tool is BoltzGen-specific
    and MSA-free, and its output feeds `run_boltzgen_analyze` in the exact
    shape that step expects -- do not substitute a different predictor's
    output here, `run_boltzgen_analyze` reads BoltzGen's own `.npz`
    metadata format, not a generic confidence JSON.

  ## What you must supply
  Choose exactly one input mode and state with_target explicitly:
  - Native: design_spec plus generated_files containing one or more complete
    matching .cif/.npz pairs. A selected subset is valid; pass both files for
    every selected design. Folder paths and unmatched files are rejected.
  - External: structure (PDB/CIF, optionally gzip), design_chains (actual
    chain IDs), and designed_sequences (map each design chain to its sequence).
    For example, an RFdiffusion3 complex and ProteinMPNN sequence use
    structure: complex.cif.gz, design_chains: [A], designed_sequences: {A: ACDE...}.
    Sequences follow observed residue order and must have exactly the same
    length. Canonical protein chains only. Design residues need complete
    N/CA/C/O backbones; rebuild Genie3 CA traces before this handoff.

  External conversion preserves the observed backbone, changes only the named
  chains' sequences, and removes their old sidechains. BoltzGen's native YAML
  parser, featurizer and DesignWriter derive and serialize genuine metadata;
  no sequence generation, structure prediction or invented confidence values
  are involved in conversion. Missing sidechain coordinates stay unresolved.
  BoltzGen assigns native output chain IDs, which can differ from the input
  IDs. outputs.chain_mapping_json records input_to_generated and input_to_refolded
  mappings; binder-alone refolds include only design chains. Use these mappings
  when selecting output chains. The exported design_spec uses generated chain IDs.
  The normal folding step then runs with the caller's checkpoint and settings.

  ## Downstream analysis
  Pass outputs.design_spec_yaml and selected complete outputs.generated_designs
  pairs to run_boltzgen_analyze, together with this call's corresponding
  refolded_structures and refold_metrics. External converted designs retain
  the same ID across all outputs. The exported specification contains concrete
  sequences for CLI validation; the CIF/NPZ pair carries the actual design mask.

  ## What you get back
  `refolds`: one entry per design, `{"id", "design_ptm", "design_iptm",
  "design_to_target_iptm", "design_iiptm", "design_residue_iptm",
  "min_interaction_pae", "min_design_to_target_pae", "interaction_pae",
  "iptm", "ptm", "protein_iptm", "target_ptm", "ligand_iptm",
  "complex_plddt", "complex_iplddt", "complex_pde", "complex_ipde",
  "num_samples", "best_sample_index"}` -- the metrics of the
  highest-confidence internal sample (0.8*iptm + 0.2*ptm, matching which
  sample `refolded_structures` wrote). `num_refolds`, and under `outputs`
  the paths to every refolded structure and the full per-sample metrics.
  PAE here is in Angstroms, lower is better; every `*iptm`/`*ptm`/`*plddt`
  field is 0-1, higher is better.

schema:
  with_target:
    type: boolean
    required: true
    description: >-
      Whether the target chain(s) are PRESENT while the design is refolded.
      Two different experiments, and the one this server refuses to pick for
      you -- docs/TOOLS.md's own rule is that whether a prediction runs with
      the target present or on the binder alone is the caller's decision.

      true  -- refold the design IN COMPLEX with its target. An estimate of
               the INTERFACE: does the model place this binder on this target.
      false -- refold the design ALONE, target removed. A self-consistency
               check on the design's own shape: does the sequence fold back
               into what the generator drew, independent of any binding.

      Run both when you want run_boltzgen_analyze to carry both the
      `folding-*` and the `designfolding-*` columns; run_boltzgen_filter can
      then rank on either. No default: defaulting would make the more
      consequential of the two the silent one.
    example: true
  design_spec:
    type: string
    format: path
    pattern: '\.(yaml|yml)$'
    required: false
    description: >-
      The design specification YAML the designs came from. Its content has
      no effect on this step's own numbers -- required only because
      `boltzgen run` validates every design spec it is given before running
      any step, `--steps folding` included.

      Use outputs.design_spec_yaml from run_boltzgen_design or
      run_boltzgen_inverse_fold. The tools create this file internally;
      the caller does not need to write YAML for this handoff.
    example: design_spec.yaml
  generated_files:
    type: array
    minItems: 2
    items:
      type: string
      format: path
    required: false
    description: >-
      Native mode: one or more complete matching .cif/.npz pairs from
      outputs.generated_designs or outputs.inverse_folded_designs. A selected
      subset is valid. Each design must include both files, exactly once.
      Supply design_spec; do not combine with structure or designed_sequences.
    example: ["design_spec_0.cif", "design_spec_0.npz"]
  structure:
    type: string
    format: path
    pattern: '\.(pdb|cif)(\.gz)?$'
    description: >-
      External protein complex backbone, such as RFdiffusion3 or rebuilt Genie3 output.
      Alternative to design_spec + generated_files. Supply design_chains and
      designed_sequences. Design residues require N, CA, C and O coordinates.
  design_chains:
    type: array
    minItems: 1
    items:
      type: string
    description: Explicit structure chain IDs carrying the designed sequence; required with structure.
  designed_sequences:
    type: object
    additionalProperties:
      type: string
    description: >-
      Map every design_chains ID to its ProteinMPNN or other designed sequence,
      in structure residue order. Exactly one canonical uppercase amino acid per
      observed protein residue. Other chains keep their structure sequences.
    example: {B: ACDEFGHIK}
  folding_checkpoint:
    type: string
    default: "huggingface:boltzgen/boltzgen-1:boltz2_conf_final.ckpt"
    description: >-
      Path or huggingface:repo:file reference for the folding (confidence
      model) checkpoint. BoltzGen's own default, already cached on this
      host (~2.0G).
    example: "huggingface:boltzgen/boltzgen-1:boltz2_conf_final.ckpt"
  recycling_steps:
    type: integer
    minimum: 0
    maximum: 10
    default: 3
    description: >-
      Number of recycling passes through the trunk before diffusion. More
      recycling can improve hard interfaces at roughly linear extra cost;
      3 is BoltzGen's own default for this step.
    example: 3
  sampling_steps:
    type: integer
    minimum: 1
    maximum: 1000
    default: 200
    description: >-
      Number of diffusion denoising steps per refold sample. Fewer is
      faster and lower quality; 200 is BoltzGen's own default for this
      step (verified live: a full 200-step refold of a 179-token complex
      took 52.6s on this host's GPU 7, well within this tool's timeout).
    example: 200
  diffusion_samples:
    type: integer
    minimum: 1
    maximum: 25
    default: 5
    description: >-
      Number of independent refold samples per design. This tool reports
      the highest-confidence one as its headline metrics (see "What you
      get back"), but `refold_metrics` carries the full spread for all of
      them. 5 is BoltzGen's own default for this step.
    example: 5
  use_kernels:
    type: string
    enum: ["auto", "true", "false"]
    default: auto
    description: >-
      Whether to use BoltzGen's fused CUDA kernels. "auto" (BoltzGen's own
      default) enables them when the GPU's compute capability is >= 8.0 --
      confirmed live on this host's GPUs (capability 8.9), kernels are used.
    example: auto
  moldir:
    type: string
    default: "huggingface:boltzgen/inference-data:mols.zip"
    description: >-
      Path or huggingface:repo:file reference for BoltzGen's canonical
      molecule/CCD library, needed to resolve residue and ligand chemistry.
      BoltzGen's own default, already cached on this host.
    example: "huggingface:boltzgen/inference-data:mols.zip"
  num_workers:
    type: integer
    minimum: 0
    maximum: 0
    default: 0
    description: >-
      DataLoader worker process count. Defaults to 0 to load in the prediction
      process. Only 0 is supported to prevent multiprocessing queue stalls
      when container shared memory fills during tensor transfer; use
      num_workers=0.
    example: 0
