name: run_mpnn
category: sequence_design
composite: false
timeout_s: 1800

engine:
  repo: mpnn
  env: mpnn
  entry: ["python", "-m", "ligandmpnn.run"]

requires:
  gpu: false

outputs:
  - name: designs_fasta
    pattern: "seqs/*.fa"
    description: >-
      Designed sequences in FASTA format, and the same sequences come back in
      this tool's JSON reply under `designs`.

      A MULTI-CHAIN INPUT COMES BACK JOINED BY ':'. Given a generator's
      two-chain complex, a design reads `<chain A>:<chain B>` -- the chains in
      the file's own order, with ':' as the chain separator, not an amino acid.

      SPLIT IT ON ':' BEFORE FOLDING. A folding tool takes ONE sequence per
      entry in its `chains` list, so each part becomes its own entry. Handing
      the joined string over, or stripping the ':' and passing the rest,
      folds the design and the target as a single run-on chain -- a FUSION
      PROTEIN, not a complex. Nothing refuses it: ':' is not a character the
      validator rejects and not a chain break the folder honours, so what
      comes back is a plausible structure with no interface, and an interface
      scorer run on it afterwards has no chain pair to score. Observed live,
      2026-09-23: a 70-residue design and a 504-residue target folded as one
      574-residue chain.

      WHICH PART IS THE DESIGN depends on the generator's chain order, and
      they disagree -- run_genie3_binder and run_rfdiffusion3_binder write
      their design into chain A, run_rfdiffusion2, run_protpardelle and
      run_proteina_complexa_generate into chain B. It is the same chain you
      named in `chains_to_design`.
    multiple: true

summary: >-
  Design amino acid sequences for a fixed protein backbone (ProteinMPNN and its
  variants). This is the step between generating a backbone and predicting what
  that sequence actually folds into. Select the variant with model_type:
  protein for the standard model, soluble to avoid designing buried
  hydrophobics, ligand when a small molecule, nucleotide or metal is present.

doc: |
  ## What this is
  Inverse folding: given backbone coordinates, predict amino acid sequences
  likely to fold into them. One codebase serves three trained variants, chosen
  with `model_type`.

  ## What it is for
  Every generative backbone model produces coordinates without a sequence.
  This turns them into something you can express, and is the most mature and
  most validated step in the whole design pipeline.

  ## When to use this instead of the alternatives
  - `model_type: protein` is the default and correct for a bare protein
    backbone.
  - `model_type: soluble` is trained to avoid the exposed hydrophobic patches
    the standard model places when it has no membrane context. Prefer it for
    anything you intend to express in solution.
  - `model_type: ligand` conditions on non-protein atoms. Use it whenever a
    small molecule, nucleotide or metal sits in the structure; the standard
    model ignores them and will design a sequence that clashes.
  - After designing, fold the sequence back and check it matches the backbone
    you designed for. A sequence this tool likes is not automatically one that
    folds.

  ## What you must supply
  A backbone PDB. Side chains are ignored.

  ## What you get back
  `designs`, each with `id`, `sequence` and `overall_confidence`;
  `num_designs`; and under `outputs` the path(s) to the FASTA file(s).

  ## Important caveat
  The first record the engine emits is the INPUT sequence, not a design. It is
  dropped here. Confidence is the model's own likelihood, not a prediction of
  experimental success.

schema:
  chains_to_design:
    type: string
    default: null
    pattern: "^[A-Za-z0-9]( [A-Za-z0-9])*$"
    description: >-
      Which chain(s) to design, space-separated (e.g. "B", or "A B"). LEAVING
      THIS UNSET DESIGNS EVERY CHAIN IN THE FILE, including a target you meant
      to keep -- a 504-residue target plus an 80-residue binder came back as
      one 585-residue sequence that is neither. Every binder generator here
      returns a two-chain complex, so for binder design you almost always want
      to name the design chain. Which chain that is differs per generator:
      run_rfdiffusion3_binder and run_genie3_binder put it in chain A,
      run_rfdiffusion2, run_protpardelle and run_proteina_complexa_generate in
      chain B. Read the generator's own output description rather than
      assuming.
    example: "B"
  fixed_residues:
    type: string
    default: null
    description: >-
      Individual residues to hold fixed, space-separated `{chain}{number}`
      tags (e.g. "A12 A13 B2"). Finer-grained than chains_to_design and
      combinable with it: use this to keep an interface motif while
      redesigning the rest of the same chain.
    example: "A12 A13 B2"
  redesigned_residues:
    type: string
    default: null
    description: >-
      The inverse of fixed_residues -- design ONLY these residues and hold
      everything else fixed, same `{chain}{number}` tag format. Use whichever
      of the two is shorter to write; naming both is accepted by the engine
      but makes the intent hard to read.
    example: "B5 B6"
  backbone_pdb:
    type: string
    format: path
    pattern: '\.(pdb|cif)(\.gz)?$'
    required: true
    description: >-
      Backbone structure to design a sequence for. A GZIPPED `.pdb.gz` or
      `.cif.gz` is accepted as-is: `run_rfdiffusion3_binder` writes its
      `structure_cif` compressed, and ProDy -- which LigandMPNN parses with --
      reads it directly, so decompressing first would be work the caller does
      for nothing. Confirmed in the mpnn environment on RFdiffusion3's own
      output: 4234 atoms parsed, all of them selected as protein.

      Most generators return a TWO-CHAIN complex here: target plus design.
      Name the design with `chains_to_design` or every chain is redesigned,
      including the target -- which chain that is differs per generator, so
      read the one you used.
    example: backbone.pdb
  model_type:
    type: string
    enum: ["protein", "soluble", "ligand"]
    default: protein
    description: Which trained variant to use.
    example: soluble
  num_sequences:
    type: integer
    minimum: 1
    maximum: 128
    default: 8
    description: How many sequences to sample.
    example: 8
  sampling_temp:
    type: number
    minimum: 0.0001
    maximum: 1.0
    default: 0.1
    description: Sampling temperature. Lower is more conservative.
    example: 0.1
  seed:
    type: integer
    minimum: 0
    default: 37
    description: Random seed. Fixed by default so runs are reproducible.
    example: 37
