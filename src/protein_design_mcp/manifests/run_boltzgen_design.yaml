name: run_boltzgen_design
category: binder_generation
composite: false
timeout_s: 3600

engine:
  repo: boltzgen
  # Plain, non-editable `pip install boltzgen` (PyPI 0.3.2) -- see
  # run_boltzgen_filter's manifest comment for the identity-verification and
  # mount-discovery detail; identical for every tool on this engine.
  prefix: /home/jk661/miniforge3/envs/boltzgen
  # The WRAPPER, not `boltzgen run` directly. BoltzGen takes a design-spec
  # YAML, and this tool's parameters describe the design rather than naming a
  # spec file -- so something has to build the spec from them, and that is
  # scripts/engines/boltzgen_design.py. Pointed straight at `boltzgen run`,
  # the adapter's own `--target-structure ... --passthrough` argv reached
  # BoltzGen, which rejected every call with "unrecognized arguments" for
  # live_proof's arguments as much as for a model's.
  entry: ["python", "/app/scripts/engines/boltzgen_design.py"]
  env_vars:
    # Weights (~5.6G: two design checkpoints + the moldir library) are
    # already downloaded to the host's real HuggingFace cache -- see
    # install-boltzgen-chai1.md. Without this override,
    # dispatch.env.EnvDispatcher's own default (HF_HOME inside this run's
    # disposable scratch workdir) would force a multi-GB re-download on
    # every single call.
    HF_HOME: /home/jk661/.cache/huggingface
  mounts:
    - /home/jk661/.cache/huggingface

requires:
  gpu: true

outputs:
  - name: design_spec_yaml
    pattern: "design_spec.yaml"
    description: >-
      The BoltzGen spec this run used, whether it was built from the
      parameters or copied from a hand-written one. PASS THIS to
      run_boltzgen_fold, run_boltzgen_analyze, run_boltzgen_filter and
      run_boltzgen_inverse_fold as their `design_spec`: those steps refuse to
      run without the spec the designs came from, and before this output
      existed nothing on this server produced one, so they could not be
      reached from a planned workflow at all.
  # Pattern matches BOTH `<id>.cif` and its companion `<id>.npz`: `[cn][ip][fz]`
  # is a 3-position character class ("cif" or "npz", nothing else -- both
  # extensions happen to be 3 characters, and no other extension in this
  # directory matches any combination it allows). BoltzGen's own downstream
  # steps (fold/design_fold/analyze, via data_from_generated.py) read a
  # design's .npz metadata (design_mask, mol_type, ...) from the SAME
  # directory as its .cif, by matching stem -- without the .npz collected
  # here too, run_boltzgen_fold/run_boltzgen_analyze would have no path to
  # this tool's output at all (results.collect_outputs puts every declared
  # output under its OWN name's subdirectory, so a second `generated_metadata`
  # spec would land the .npz files in a DIFFERENT collected directory than
  # the .cif files, breaking the same-directory requirement all over again).
  # See wave-E-report.md for the full reasoning.
  - name: generated_designs
    pattern: "intermediate_designs/*.[cn][ip][fz]"
    description: >-
      One all-atom mmCIF plus its metadata .npz per generated design. Chain
      composition matches design_spec's own entities (the target chain(s)
      unchanged, the designed chain(s) with new coordinates AND a new
      sequence BoltzGen's diffusion model proposed jointly). This is NOT
      yet inverse-folded -- see the doc's "What you get back" for why that
      usually matters. Pass this WHOLE list (both file types) as
      run_boltzgen_fold's or run_boltzgen_inverse_fold's `generated_files`
      to continue the pipeline -- the .npz is required, not optional, for
      those tools to read this design back.
    multiple: true

summary: >-
  Generate a binder against a target with BoltzGen's all-atom diffusion
  model, MSA-free (BoltzGen never builds or accepts an alignment -- the
  target comes straight from a PDB/CIF you supply inside design_spec). This
  is the `design` step of BoltzGen's own pipeline, run in isolation: it
  samples backbone coordinates AND a sequence together, but the sequence it
  proposes is usually lower quality than what BoltzGen's own inverse-folding
  head produces afterward -- chain this tool's output into
  `run_boltzgen_inverse_fold` for the sequence
  BoltzGen's own default pipeline would actually keep.

doc: |
  ## What this is
  BoltzGen's `design` pipeline step (`boltzgen.task.predict.predict.Predict`
  over `design.yaml`), run in isolation via
  `boltzgen run <design_spec> --steps design`. An all-atom diffusion model
  jointly samples 3D coordinates and a sequence for every residue
  design_spec marks as designed, conditioned on the target structure(s) and
  any fixed/templated residues design_spec also supplies. BoltzGen refolds
  and scores internally with its OWN weights elsewhere in its pipeline (the
  `folding`/`design_folding`/`analysis` steps) -- it does not call ESMFold,
  and this step alone computes no confidence metric at all.

  ## What it is for
  The first step of a binder-design campaign: propose backbone shape and an
  initial sequence for a chain that binds a target you supply directly as a
  structure file. MSA-free by construction -- there is no alignment
  parameter here because BoltzGen's diffusion model never takes one.

  ## `--protocol` has no effect on this step, verified empirically
  BoltzGen's `--protocol` preset (`protein-anything`, `peptide-anything`,
  ...) changes settings on the `analysis`, `filtering`, and (for
  peptide/nanobody/antibody protocols) `inverse_folding` steps only --
  confirmed live by running `boltzgen configure` with `--steps design` under
  all six protocols and diffing the resolved `design.yaml`: byte-identical
  in every case except the `--output` path itself. This tool therefore does
  not expose `protocol` -- a parameter with no observable effect would be
  actively misleading to document as a choice. Chain composition, target
  identity, and which residues are designed come entirely from design_spec
  itself; nothing about "what kind of binder this is" is inferred from a
  protocol name.

  ## When to use this instead of the alternatives
  - `run_rfdiffusion_binder` and
    `run_rfdiffusion2` and
    `run_rfdiffusion3_binder` and
    `run_genie3_binder` and
    `run_protpardelle`
    are the direct siblings -- backbone-only binder generators
    that need a separate sequence-design step afterward (`run_mpnn`) rather
    than BoltzGen's own joint all-atom sampling.
  - This tool's own generated sequence is usually a starting point, not the
    keeper -- BoltzGen's own default pipeline immediately re-derives it with
    its inverse-folding head. Feed this tool's output `.cif` into
    `run_boltzgen_inverse_fold`, marking the designed
    chain for redesign, to get the sequence BoltzGen's own pipeline would
    actually keep.
  - After that, refold the result with a structure predictor (e.g.
    `run_chai1`, `run_boltz`)
    and score the interface (`run_ipsae`) before trusting any candidate --
    this tool computes no confidence metric of its own.

  ## What you must supply
  `design_spec`: a BoltzGen design specification YAML. At minimum, an
  `entities` list with a `protein:` block for the chain to design (a fixed
  sequence, or a residue-count range like `15..20` for BoltzGen to sample
  the length too) and a `file:` block pointing at the target structure (PDB
  or mmCIF), with `include:`/`chain:` selectors naming which chain(s) of
  that file to use. Chain composition -- which chain is the target, which is
  designed, whether more than one chain of each is present -- is entirely
  design_spec's own decision; nothing here is inferred from a bare
  structure's shape. See BoltzGen's own `example/vanilla_protein/` for the
  full grammar (multi-entity mixes, binding-site hints, motifs,
  `design:`/`not_design:` residue masks on a `file:` entity).

  ## Important caveats
  - This tool runs no scoring of any kind -- not even an internal one. A
    design with a low design_ptm/design_iptm after refolding is expected and
    normal; that is what `run_boltzgen_inverse_fold`
    and `run_boltzgen_filter` are for.
  - `--reuse` (BoltzGen's own flag to skip regenerating designs already on
    disk) is not exposed here: every call gets a fresh, empty scratch
    directory, so there is never anything to reuse.
  - `num_designs` defaults to 10 here, not BoltzGen's own CLI default of
    10,000 -- that default is sized for an unattended production campaign,
    not a single interactive call. Raising it raises this call's own
    runtime roughly linearly (see `timeout_s`, fixed at 3600s for this
    tool -- a large `num_designs` will need more time than that budget
    gives it; the run is killed at the timeout with its scratch directory
    preserved for diagnosis, not silently truncated).

  ## What you get back
  `designs`: one entry per generated `.cif`, each `{"id", "chains": [{
  "chain_id", "sequence", "length"}, ...]}` for every chain in that file
  (target chain(s) included, unchanged across designs -- a genuine
  confirmation of what stayed fixed, not a guess). `num_designs`, and under
  `outputs` the paths to every generated `.cif`.

schema:
  target_structure:
    type: string
    format: path
    pattern: '\.(pdb|cif)(\.gz)?$'
    required: true
    description: >-
      The target to design against. Its chains are conditioned on; the binder
      is a new chain this tool adds. Pass the path a previous step returned.

      WHERE THIS COMES FROM -- The target you want a binder against -- your
      own structure file, or a path a previous step returned.
    example: target.cif
  target_chains:
    type: array
    items:
      type: string
      pattern: '^[A-Za-z0-9]$'
    minItems: 1
    required: true
    description: >-
      Which chains of `target_structure` to condition on, e.g. ["A"]. At least
      one: an empty list conditions on nothing, which is unconditional
      generation wearing a binder tool's name. Read the chain ids off the
      structure rather than assuming -- they differ per file.
    example: ["A"]
  binder_length_min:
    type: integer
    minimum: 8
    maximum: 1000
    default: 80
    description: >-
      Shortest binder to sample. BoltzGen picks a length in
      [binder_length_min, binder_length_max] per design, so equal values fix
      the length and a wide range trades designability for diversity.
    example: 80
  binder_length_max:
    type: integer
    minimum: 8
    maximum: 1000
    default: 140
    description: >-
      Longest binder to sample. Must be at least binder_length_min.
    example: 140
  binder_chain_id:
    type: string
    pattern: '^[A-Za-z0-9]$'
    default: C
    description: >-
      Chain id given to the designed chain in the output. Must not be one of
      `target_chains`: two entities claiming one id is a spec BoltzGen accepts
      and then behaves unpredictably on. This is also the chain that holds the
      design when a later step asks.
    example: C
  num_designs:
    type: integer
    minimum: 1
    maximum: 10000
    default: 10
    description: >-
      Total number of designs to sample. BoltzGen's own CLI default is
      10,000 (sized for an unattended campaign that gets filtered down
      afterward); this tool defaults to 10, sized for one interactive call
      -- raise it for a real campaign, but runtime grows roughly linearly
      and this tool's timeout_s is a fixed 3600s (see the doc's caveats).
    example: 10
  diffusion_batch_size:
    type: integer
    minimum: 1
    maximum: 1000
    required: false
    description: >-
      Number of diffusion samples generated per trunk run (a batching/speed
      knob, not a quality one). Left unset, BoltzGen picks 1 if num_designs
      < 100 else 10 -- its own default heuristic, kept as this tool's
      default too. All designs generated in the same batch share the same
      sampled length when design_spec gives a residue-count range, so a
      large batch size relative to num_designs undersamples the length
      range; leave this unset unless you specifically need to control that.
    example: 10
  design_checkpoints:
    type: array
    minItems: 1
    items:
      type: string
    default: ["huggingface:boltzgen/boltzgen-1:boltzgen1_diverse.ckpt", "huggingface:boltzgen/boltzgen-1:boltzgen1_adherence.ckpt"]
    description: >-
      Which trained checkpoint(s) to sample from; with more than one, each
      gets an equal fraction of num_designs. BoltzGen's own defaults are
      both official checkpoints -- "diverse" favours broader exploration
      of backbone shapes, "adherence" favours matching design_spec's
      structural hints more tightly. Pass a single entry (either one, or a
      local path to a fine-tuned checkpoint) to sample from only that one.
    example: ["huggingface:boltzgen/boltzgen-1:boltzgen1_diverse.ckpt"]
  step_scale:
    type: number
    minimum: 0.1
    maximum: 5.0
    required: false
    description: >-
      Fixed diffusion step size, overriding BoltzGen's own default
      four-phase schedule (which alternates 1.8/2.0). Left unset, the
      schedule is used, which is BoltzGen's own recommended default. Set
      this only if you have a specific reason to fix it -- there is no
      single value that dominates the schedule across the board.
    example: 1.8
  noise_scale:
    type: number
    minimum: 0.0
    maximum: 2.0
    required: false
    description: >-
      Fixed diffusion noise scale, overriding BoltzGen's own default
      four-phase schedule (which alternates 0.95/0.88). Left unset, the
      schedule is used, which is BoltzGen's own recommended default.
    example: 0.98
  use_kernels:
    type: string
    enum: ["auto", "true", "false"]
    default: auto
    description: >-
      Whether to use BoltzGen's fused CUDA kernels. "auto" (BoltzGen's own
      default) enables them when the GPU's compute capability is >= 8.0 --
      confirmed live on this host's GPUs (capability 8.9), kernels are used.
      "false" is slower but a useful fallback if a kernel-related error
      ever needs ruling out.
    example: auto
  moldir:
    type: string
    default: "huggingface:boltzgen/inference-data:mols.zip"
    description: >-
      Path or huggingface:repo:file reference for BoltzGen's canonical
      molecule/CCD library, needed to resolve residue and ligand chemistry.
      BoltzGen's own default, already cached on this host.
    example: "huggingface:boltzgen/inference-data:mols.zip"
  num_workers:
    type: integer
    minimum: 0
    maximum: 32
    default: 1
    description: >-
      DataLoader worker process count. Raise for a large num_designs if
      data loading (not GPU compute) is the bottleneck; 1 is a safe default
      for a single interactive call.
    example: 1
