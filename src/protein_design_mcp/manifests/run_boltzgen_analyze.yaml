name: run_boltzgen_analyze
category: run_analysis
composite: false
timeout_s: 1800

engine:
  repo: boltzgen
  # See run_boltzgen_filter's manifest comment for the identity-verification
  # and mount-discovery detail; identical for every tool on this engine.
  prefix: /home/jk661/miniforge3/envs/boltzgen
  entry: ["boltzgen", "run"]
  # Analyze reads a design's original .cif/.npz from design_dir itself, and
  # its refolded structures/metrics from design_dir/refold_cif and
  # design_dir/fold_out_npz specifically -- hardcoded relative to ONE
  # design_dir (analyze.py's own init_datasets), not independently
  # configurable. Two DIFFERENT prior tool calls' outputs (run_boltzgen_design
  # or run_boltzgen_inverse_fold, and run_boltzgen_fold) are each already
  # collected under their OWN name (results.collect_outputs namespaces every
  # declared output by spec name) -- `stage`+`stage_subdir` reassembles them
  # into the specific tree analyze.py expects before this engine runs.
  # Optionally a THIRD call's output (run_boltzgen_fold (with_target=false)) goes to
  # design_dir/fold_out_design_npz for the designfolding-* metrics.
  stage: ["generated_files", "refold_structures", "refold_metrics", "design_refold_structures", "design_refold_metrics"]
  stage_subdir:
    generated_files: design_dir
    refold_structures: design_dir/refold_cif
    refold_metrics: design_dir/fold_out_npz
    design_refold_structures: design_dir/refold_design_cif
    design_refold_metrics: design_dir/fold_out_design_npz
  env_vars:
    # Analyze runs no model at all (CPU dataframe/structure-geometry work),
    # but `boltzgen run` still resolves every OTHER step's checkpoint path
    # while building its (unexecuted, `--steps analysis`-trimmed) pipeline
    # object, so HF_HOME is pointed at the host's real cache to keep that
    # resolution a cache hit rather than forcing a re-download attempt
    # inside this run's disposable scratch workdir.
    HF_HOME: /home/jk661/.cache/huggingface
  mounts:
    - /home/jk661/.cache/huggingface
    # foldseek (confirmed present, `foldseek version` -> 8dc75c7..., used by
    # run_clustering below) is a STANDALONE BINARY this task shells out to
    # via subprocess (Analyze.run_foldseek_clustering), not a Python import
    # -- `python -m protein_design_mcp.mounts` (discover_mounts) walks a
    # target environment's sys.path/.pth files to find an IMPORTED module's
    # source, and has nothing to walk here, so it can never produce this
    # entry. It must stay hand-declared: if this line is ever "cleaned up"
    # by re-running mount discovery and trusting its output alone, foldseek
    # clustering breaks silently inside the image while continuing to work
    # on the bare host (the container has no ~/.local/bin at all) -- the
    # exact bug class this manifest exists to prevent, per
    # scripts/container_run.py's --check. /opt/foldseek exists on this host
    # too but is an EMPTY directory -- do not mount that one, it is
    # misleading, not a real install.
    - /home/jk661/.local/bin/foldseek

requires:
  gpu: false

outputs:
  - name: aggregate_metrics_csv
    pattern: "design_dir/aggregate_metrics_analyze.csv"
    description: >-
      One row per design, every computed metric as a column -- this is
      what `run_boltzgen_filter` ranks on. Pass this AND `sequence_cache`
      straight through as `run_boltzgen_filter`'s `metrics_files`.
  - name: per_target_metrics_csv
    pattern: "design_dir/per_target_metrics_analyze.csv"
    description: Aggregate statistics (means, pass rates) per target, one row per target.
  - name: sequence_cache
    pattern: "design_dir/ca_coords_sequences.pkl.gz"
    description: >-
      Per-design CA coordinates and sequences, required by
      `run_boltzgen_filter`'s diversity selection. Pass this AND
      `aggregate_metrics_csv` straight through as `run_boltzgen_filter`'s
      `metrics_files`.

summary: >-
  Compute CPU metrics over a design and aggregate them into the ranking
  table `run_boltzgen_filter` reads -- BoltzGen's own `analysis` pipeline
  step, run in isolation. This step runs no model: no GPU use, no `boltz`
  import, pure geometry/dataframe computation (ΔSASA, backbone RMSD,
  non-covalent contacts, hydrophobic patches, liability scoring) over
  structures `run_boltzgen_fold`/`run_boltzgen_fold` with `with_target: false` already
  produced. Feed it the WHOLE outputs of run_boltzgen_design (or
  run_boltzgen_inverse_fold) and run_boltzgen_fold -- every file, not just
  the structures.

doc: |
  ## What this is
  BoltzGen's `analysis` pipeline step (`boltzgen.task.analyze.analyze.Analyze`),
  run in isolation via `boltzgen run <design_spec> --steps analysis`. It
  aggregates metrics from the Folding, Designfolding, and (if requested)
  Affinity predictions into a single per-design CSV, computing several more
  metrics itself on CPU along the way: ΔSASA (buried surface area),
  backbone/all-atom refolding RMSD, non-covalent contact counts, largest
  hydrophobic patch, and sequence liability scores (deamidation, oxidation,
  protease sites). This is the step that produces
  `design_iptm`/`min_interaction_pae`/`delta_sasa_refolded`/`bb_rmsd` and
  every other column `run_boltzgen_filter` ranks or thresholds on -- without
  it, filter has nothing to read.

  **This step runs no model.** No GPU use, no `boltz` import -- CPU-only
  dataframe and structure-geometry computation over numbers
  `run_boltzgen_fold`/`run_boltzgen_fold` with `with_target: false` already produced elsewhere.

  ## `--protocol` is not exposed, for the same reason it is not exposed on
  `run_boltzgen_filter`: every setting a protocol preset would otherwise
  control here (`affinity_metrics`, `largest_hydrophobic`,
  `largest_hydrophobic_refolded`, `designfolding_metrics`,
  `use_design_mask_for_target`) is instead its own explicit parameter
  below, always passed via `--config analysis`, which -- as with
  `run_boltzgen_filter` -- always wins over whatever a protocol preset
  would otherwise set (BoltzGen's own CLI applies protocol presets AFTER
  its computed top-level values in the same argv concatenation).

  ## When to use this instead of the alternatives
  - This is the ONLY tool in this server that produces
    `aggregate_metrics_*.csv` -- `run_boltzgen_filter` cannot run without
    having called this first (or an equivalent full `boltzgen run`, done
    outside this server).
  - `run_ipsae`/`run_prodigy` score ONE structure at a time from a raw
    predictor output; this tool aggregates a whole batch's worth of
    BoltzGen-specific metrics (ΔSASA, liability scores, refolding RMSD)
    that those tools do not compute at all.
  - `run_proteina_complexa_analyze` is the equivalent step for a DIFFERENT
    engine (Proteina-Complexa) -- do not mix a Proteina-Complexa run's
    outputs into this tool, the file formats are not compatible.

  ## What you must supply
  - `design_spec`: the SAME design specification YAML the designs came
    from. Required only because `boltzgen run` validates every design spec
    it is given before running any step at all; its content does not
    change this step's own numbers.
  - `generated_files`: the WHOLE `outputs.generated_designs` (from
    `run_boltzgen_design`) or `outputs.inverse_folded_designs` (from
    `run_boltzgen_inverse_fold`) list.
  - `refold_structures` + `refold_metrics`: `run_boltzgen_fold`'s OWN
    `refolded_structures` and `refold_metrics` outputs, passed through
    unfiltered.
  - `design_refold_structures` + `design_refold_metrics` (optional):
    `run_boltzgen_fold` with `with_target: false`'s own outputs, if you also ran that tool --
    required together with `designfolding_metrics: true` to get
    `designfolding-*` columns; leave both unset otherwise.

  ## Important caveats
  - The `designfolding_metrics: true` path (with `design_refold_structures`/
    `design_refold_metrics`) is unit-tested but has not yet been exercised
    in a live GPU run -- see `designfolding_metrics`'s own parameter
    description. Every other path in this tool HAS been verified live,
    including the full design -> fold -> analyze -> filter chain.
  - Turning on the foldseek structural-clustering parameter below needs the
    foldseek binary this manifest declares under `engine.mounts` (see that
    comment for why it cannot be discovered automatically) -- confirmed
    present on this host, not guaranteed in every deployment.

  ## What you get back
  `num_designs_analyzed`, and under `outputs` the paths to
  `aggregate_metrics_csv` (the ranking table), `per_target_metrics_csv`,
  and `sequence_cache` -- pass `aggregate_metrics_csv` and `sequence_cache`
  straight through as `run_boltzgen_filter`'s `metrics_files`. This tool
  does not itself rank or select anything -- that is `run_boltzgen_filter`'s
  job, over the table this tool produces.

schema:
  design_spec:
    type: string
    format: path
    pattern: '\.(yaml|yml)$'
    required: true
    description: >-
      The design specification YAML the designs came from. Its content has
      no effect on this step's own numbers -- required only because
      `boltzgen run` validates every design spec it is given before
      running any step, `--steps analysis` included.

      YOU WRITE THIS FILE: no tool on this server produces a BoltzGen design
      spec, so it cannot come from a previous step of a planned workflow. A
      workflow that reaches any run_boltzgen_* tool has to carry a spec path
      the caller authored -- confirmed by a run that planned run_boltzgen_fold
      after RFdiffusion3 and failed on this parameter, because there was
      nothing upstream that could have supplied one.
    example: design_spec.yaml
  generated_files:
    type: array
    minItems: 2
    items:
      type: string
      format: path
    required: true
    description: >-
      The WHOLE `outputs.generated_designs` (from run_boltzgen_design) or
      `outputs.inverse_folded_designs` (from run_boltzgen_inverse_fold)
      list -- every `.cif` AND `.npz` path that call returned, unfiltered.
    example: ["design_spec_0.cif", "design_spec_0.npz"]
  refold_structures:
    type: array
    minItems: 1
    items:
      type: string
      format: path
    required: true
    description: >-
      `run_boltzgen_fold`'s own `refolded_structures` output, passed
      through unfiltered.
    example: ["design_spec_0.cif"]
  refold_metrics:
    type: array
    minItems: 1
    items:
      type: string
      format: path
    required: true
    description: >-
      `run_boltzgen_fold`'s own `refold_metrics` output, passed through
      unfiltered -- required to compute `design_iptm`,
      `min_interaction_pae`, and every other confidence-based column.
    example: ["design_spec_0.npz"]
  design_refold_structures:
    type: array
    minItems: 1
    items:
      type: string
      format: path
    required: false
    description: >-
      `run_boltzgen_fold` with `with_target: false`'s own `refolded_structures` output, if you
      also ran that tool. Supply together with `design_refold_metrics` and
      set `designfolding_metrics: true` to get `designfolding-*` columns;
      leave unset otherwise.
    example: ["design_spec_0.cif"]
  design_refold_metrics:
    type: array
    minItems: 1
    items:
      type: string
      format: path
    required: false
    description: >-
      `run_boltzgen_fold` with `with_target: false`'s own `refold_metrics` output, if you also
      ran that tool. Supply together with `design_refold_structures`.
    example: ["design_spec_0.npz"]
  affinity_metrics:
    type: boolean
    default: false
    description: >-
      Compute affinity-related columns. Requires an `affinity` step's
      output (small-molecule-binder campaigns) which no tool in this
      server produces -- BoltzGen's affinity head is protein-ligand only
      and excluded here the same way Boltz-2's is. Leave false.
    example: false
  backbone_fold_metrics:
    type: boolean
    default: true
    description: >-
      Compute backbone-only refolding RMSD metrics (`bb_rmsd*`,
      `bb_designability_rmsd_*`). true is BoltzGen's own default for a
      normal (inverse-folded) run.
    example: true
  allatom_fold_metrics:
    type: boolean
    default: true
    description: >-
      Compute all-atom refolding RMSD metrics (`rmsd`, `rmsd_design`), in
      addition to (or instead of, if the design was not inverse-folded)
      the backbone-only ones. true is BoltzGen's own default.
    example: true
  noncovalents_original:
    type: boolean
    default: true
    description: >-
      Count non-covalent interface contacts (hydrogen bonds, salt bridges,
      hydrophobic contacts -- `plip_hbonds`, `plip_saltbridge`,
      `plip_hydrophobic`) on the ORIGINAL (pre-refold) structure. true is
      BoltzGen's own default.
    example: true
  noncovalents_refolded:
    type: boolean
    default: true
    description: >-
      Same as `noncovalents_original` but on the REFOLDED structure
      (`plip_hbonds_refolded` etc. -- the columns `run_boltzgen_filter`
      ranks on by default). true is BoltzGen's own default.
    example: true
  delta_sasa_original:
    type: boolean
    default: true
    description: >-
      Compute ΔSASA (buried surface area: binder present vs absent) on the
      ORIGINAL (pre-refold) structure (`delta_sasa_original`). true is
      BoltzGen's own default.
    example: true
  delta_sasa_refolded:
    type: boolean
    default: true
    description: >-
      Same as `delta_sasa_original` but on the REFOLDED structure
      (`delta_sasa_refolded` -- the column `run_boltzgen_filter` ranks on
      by default). true is BoltzGen's own default.
    example: true
  largest_hydrophobic:
    type: boolean
    default: false
    description: >-
      Compute the largest contiguous surface hydrophobic patch on the
      ORIGINAL (pre-refold) structure. false is BoltzGen's own
      `protein-anything` default (its peptide/nanobody/antibody protocol
      presets also default this false).
    example: false
  largest_hydrophobic_refolded:
    type: boolean
    default: true
    description: >-
      Same as `largest_hydrophobic` but on the REFOLDED structure. true is
      BoltzGen's `protein-anything` default; its peptide/nanobody/antibody
      protocol presets default this false instead (a hydrophobic-patch
      penalty matters less for a short peptide/CDR loop than a bulk
      protein binder) -- set false yourself if the designs are
      peptide/nanobody/antibody-typed.
    example: true
  run_clustering:
    type: boolean
    default: false
    description: >-
      Run `foldseek easy-cluster` (TM-score threshold 0.5, structural
      alignment) over the batch's designed structures and add a
      `clusters_05_tmscore` column grouping designs by fold similarity --
      useful for telling "20 genuinely different backbones" apart from "20
      near-duplicates of 3 backbones" before spending a diversity-selection
      budget on them in `run_boltzgen_filter`. Costs one extra subprocess
      call over all_atom design PDBs, roughly linear in design count; skip
      it for a quick look. false is BoltzGen's own default. The foldseek
      binary this needs is confirmed present on this host
      (the `foldseek` binary the deployment provides, mounted explicitly -- see
      `foldseek_binary` and this manifest's `engine.mounts` comment) but is
      not guaranteed present in every deployment of this server; true
      without it fails with a clear subprocess "no such file" error rather
      than a silent wrong answer.
    example: false
  foldseek_binary:
    type: string
    default: "/home/jk661/.local/bin/foldseek"
    description: >-
      Path to the foldseek executable, used only when `run_clustering` is
      true. `Analyze`'s own Python default
      (`/data/rbg/users/hstark/foldseek/bin/foldseek`) is a path from
      BoltzGen's own development machine and does not exist here -- this
      tool's default points at the real, confirmed-working install on this
      host instead. Change this only if foldseek is installed somewhere
      else in a given deployment.
    example: "/home/jk661/.local/bin/foldseek"
  liability_analysis:
    type: boolean
    default: true
    description: >-
      Score each designed sequence for developability liabilities
      (deamidation, oxidation, protease cleavage sites, N-terminal
      cyclization). true is BoltzGen's own default.
    example: true
  liability_modality:
    type: string
    enum: ["peptide", "antibody"]
    default: peptide
    description: >-
      Which liability-scoring rules apply (deamidation/oxidation/protease-
      site heuristics differ between a short peptide and an antibody CDR).
      "peptide" is BoltzGen's own default for this step and the right
      choice for a bulk protein binder too (there is no third "protein"
      option in the underlying engine).
    example: peptide
  liability_peptide_type:
    type: string
    enum: ["linear", "cyclic"]
    default: linear
    description: >-
      Whether liability scoring treats the designed chain as linear or
      head-to-tail cyclic. Only matters when `liability_modality` is
      "peptide". "linear" is BoltzGen's own default.
    example: linear
  designfolding_metrics:
    type: boolean
    default: false
    description: >-
      Compute the `designfolding-*`-prefixed columns (the design-alone
      self-consistency comparison). Requires `design_refold_structures` and
      `design_refold_metrics` to also be supplied (from
      `run_boltzgen_fold` with `with_target: false`) -- true without them raises a
      FileNotFoundError from the underlying engine, not a clean skip.
      NOTE: this parameter and the `design_refold_structures`/
      `design_refold_metrics` inputs are covered by this tool's own unit
      tests but have NOT yet been exercised in a live GPU run (the live
      end-to-end verification of the design -> fold -> analyze -> filter
      chain used `designfolding_metrics: false`, to keep that verification
      to one clean run) -- treat this specific path as unit-tested, not
      live-verified, until someone runs it for real.
    example: false
  use_design_mask_for_target:
    type: boolean
    default: false
    description: >-
      Use the design mask (rather than the chain-design mask) to decide
      what counts as "target" for target-relative metrics -- BoltzGen's own
      `protein-redesign` protocol default, for redesigning/optimizing an
      existing protein where every chain may carry designed residues. false
      (BoltzGen's default otherwise) is correct for a normal binder-design
      campaign where the target is a separate, entirely fixed chain.
    example: false
  compute_lddts:
    type: boolean
    default: false
    description: >-
      Compute per-residue lDDT scores against the refolded structure.
      Adds noticeable CPU time (BoltzGen's own docs: ~5-15s per design).
      false is BoltzGen's own default when run through its CLI (its
      Analyze class's own Python default is true, but the CLI's
      analysis.yaml config overrides it to false).
    example: false
  num_processes:
    type: integer
    minimum: 1
    maximum: 128
    default: 32
    description: >-
      Number of worker processes for the CPU metric computation
      (`ProcessPoolExecutor`). 32 is BoltzGen's own default; lower it on a
      host with fewer cores available, or if you are running several of
      this server's tools concurrently and want to leave CPU headroom.
    example: 32
  moldir:
    type: string
    default: "huggingface:boltzgen/inference-data:mols.zip"
    description: >-
      Path or huggingface:repo:file reference for BoltzGen's canonical
      molecule/CCD library, needed to resolve residue and ligand chemistry.
      BoltzGen's own default, already cached on this host.
    example: "huggingface:boltzgen/inference-data:mols.zip"
  num_workers:
    type: integer
    minimum: 0
    maximum: 32
    default: 4
    description: >-
      DataLoader worker process count for reading designs back in (a
      different pool from `num_processes`, which does the metric
      computation itself). 4 is BoltzGen's own default for this step.
    example: 4
