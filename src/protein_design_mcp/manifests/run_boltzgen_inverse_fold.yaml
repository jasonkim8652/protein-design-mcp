name: run_boltzgen_inverse_fold
category: sequence_design
composite: false
timeout_s: 1800

engine:
  repo: boltzgen
  # Plain, non-editable `pip install boltzgen` (PyPI 0.3.2) -- see
  # run_boltzgen_filter's manifest comment for the identity-verification and
  # mount-discovery detail; identical for every tool on this engine.
  prefix: /home/jk661/miniforge3/envs/boltzgen
  entry: ["boltzgen", "run"]
  env_vars:
    # Weights (this step needs only boltzgen1_ifold.ckpt, ~12M, already
    # downloaded -- see install-boltzgen-chai1.md) live in the host's real
    # HuggingFace cache. Without this override, dispatch.env.EnvDispatcher's
    # own default (HF_HOME inside this run's disposable scratch workdir)
    # would force a re-download on every single call.
    HF_HOME: /home/jk661/.cache/huggingface
  mounts:
    - /home/jk661/.cache/huggingface

requires:
  gpu: true

outputs:
  # Pattern matches BOTH `<id>.cif` and its companion `<id>.npz` -- see
  # run_boltzgen_design.yaml's identical comment for the full reasoning
  # (`[cn][ip][fz]` is "cif" or "npz", nothing else). BoltzGen's own
  # downstream fold/design_fold/analyze steps need each design's .npz
  # metadata alongside its .cif in the SAME directory.
  - name: inverse_folded_designs
    pattern: "intermediate_designs/*.[cn][ip][fz]"
    description: >-
      One all-atom mmCIF plus its metadata .npz per requested sequence
      (inverse_fold_num_sequences of them), each carrying a fresh sequence
      for the chain(s) design_spec marked `design:`. Every other chain is
      written back unchanged. Pass this WHOLE list (both file types) as
      run_boltzgen_fold's or run_boltzgen_design_fold's `generated_files`
      to continue the pipeline -- the .npz is required, not optional.
    multiple: true

summary: >-
  Design a sequence for a fixed, fully-specified structure with BoltzGen's
  OWN inverse-folding head (boltzgen1_ifold.ckpt) -- NOT ProteinMPNN. This
  is BoltzGen's `inverse_folding` step run standalone
  (`--only_inverse_fold`), the alternative sequence-design path to
  `run_mpnn` for anyone already working in BoltzGen's own structure/spec
  format: redesigning an existing structure (including this server's own
  `run_boltzgen_design` output), not extending a diffusion run.

doc: |
  ## What this is
  BoltzGen's `inverse_folding` pipeline step
  (`boltzgen.task.predict.predict.Predict` over `inverse_fold_only.yaml`),
  run via `boltzgen run <design_spec> --steps inverse_folding
  --only_inverse_fold`. Reads a FULLY specified structure -- every residue,
  including the ones being redesigned, needs real backbone coordinates
  already, since there is no diffusion step here to generate them -- and
  predicts a new sequence for whichever residues design_spec marks
  `design:` (a `file:` entity's own `design:`/`not_design:` residue mask;
  see BoltzGen's own spec grammar). Every other residue is written back
  with its input sequence unchanged.

  This is the SAME inverse-folding head BoltzGen's own default pipeline
  runs automatically after its `design` (diffusion) step -- exposed here
  standalone so it can also be applied directly to a structure that did not
  come from BoltzGen's own diffusion model at all (an experimental
  structure, another tool's backbone, or a structure you are simply
  re-designing).

  ## When to use this instead of the alternatives
  - `run_mpnn` (ProteinMPNN/LigandMPNN/SolubleMPNN) is the field-standard
    inverse-folding tool and works from a bare backbone PDB with no spec
    file needed -- use it when you are not otherwise working in BoltzGen's
    design_spec format, or want ProteinMPNN specifically (a different
    model, different training data, different failure modes).
  - Use THIS tool when you already have (or want) a BoltzGen design_spec --
    most directly, to re-derive the sequence BoltzGen's own default
    pipeline would keep for a backbone `run_boltzgen_design` (this same
    wave) just generated: wrap that tool's output `.cif` in a design_spec
    `file:` entity, mark the designed chain with `design:`, and call this
    tool on it.
  - Neither this tool nor `run_mpnn` scores the result. Refold with a
    structure predictor and check the sequence actually folds the way you
    designed it before trusting it.

  ## What you must supply
  `design_spec`: a design specification YAML whose `file:` entity/entities
  carry real backbone coordinates for every residue, with a `design:` list
  naming the chain(s)/residue(s) to redesign (e.g. `design: [{chain: {id:
  A}}]` redesigns all of chain A; everything not listed is held fixed).
  Chain composition -- which chains are present, which are redesigned -- is
  entirely design_spec's own decision, never inferred by this tool.

  ## What you get back
  `designs`: one entry per generated `.cif` (inverse_fold_num_sequences of
  them), each `{"id", "chains": [{"chain_id", "sequence", "length"}, ...]}`
  for every chain in that file. No chain is singled out as "the design" in
  this payload -- the chain(s) you marked `design:` are the ones whose
  sequence changed; every other chain is reported too, as a genuine
  confirmation that it came back unchanged, not a guess about which is
  which. `num_designs`, and under `outputs` the paths to every generated
  `.cif`.

  ## Important caveats
  - No confidence metric of any kind is computed here -- refold and score
    before trusting a result.
  - `--reuse` is not exposed: every call gets a fresh, empty scratch
    directory, so there is never anything to reuse.
  - `avoid_residues` has no static default tied to a modality name (this
    tool does not expose `--protocol` at all): BoltzGen's own CLI defaults
    this to "C" (exclude cysteine) for its peptide/nanobody/antibody
    protocols and "" otherwise, but since design_spec alone (not a protocol
    name) determines what you are designing here, set `avoid_residues`
    directly to "C" yourself for a peptide/nanobody/antibody redesign.

schema:
  design_spec:
    type: string
    format: path
    pattern: '\.(yaml|yml)$'
    required: true
    description: >-
      Design specification YAML with a FULLY specified structure (real
      backbone coordinates for every residue) and a `design:` list naming
      which chain(s)/residue(s) to redesign. Chain composition is defined
      here, never inferred by this tool.
    example: design_spec.yaml
  inverse_fold_num_sequences:
    type: integer
    minimum: 1
    maximum: 1000
    default: 1
    description: >-
      Number of independent sequences to sample for the same fixed
      backbone. BoltzGen's own default is 1; raise it to get a diverse set
      of sequences for the same shape (verified live: 2 sequences for one
      17-residue chain took 9.1s total, most of it one-time model load).
    example: 1
  inverse_fold_checkpoint:
    type: string
    default: "huggingface:boltzgen/boltzgen-1:boltzgen1_ifold.ckpt"
    description: >-
      Path or huggingface:repo:file reference for the inverse-folding
      checkpoint. BoltzGen's own default, already cached on this host
      (~12M -- much smaller than the design/folding checkpoints).
    example: "huggingface:boltzgen/boltzgen-1:boltzgen1_ifold.ckpt"
  avoid_residues:
    type: string
    pattern: '^[A-Z]*$'
    default: ""
    description: >-
      One-letter amino acid codes this tool must never place at a designed
      position, e.g. "C" to forbid cysteine, "CM" to forbid cysteine and
      methionine. Empty (allow every residue) is BoltzGen's own default for
      a bare protein; its peptide/nanobody/antibody protocol presets
      instead default this to "C" (an unpaired free cysteine is a
      liability for those modalities: aggregation, disulfide scrambling) --
      set "C" yourself if design_spec is peptide/nanobody/antibody-typed,
      since this tool does not read a protocol name to infer it for you.
    example: C
  use_kernels:
    type: string
    enum: ["auto", "true", "false"]
    default: auto
    description: >-
      Whether to use BoltzGen's fused CUDA kernels. "auto" (BoltzGen's own
      default) enables them when the GPU's compute capability is >= 8.0 --
      confirmed live on this host's GPUs (capability 8.9), kernels are used.
    example: auto
  moldir:
    type: string
    default: "huggingface:boltzgen/inference-data:mols.zip"
    description: >-
      Path or huggingface:repo:file reference for BoltzGen's canonical
      molecule/CCD library, needed to resolve residue and ligand chemistry.
      BoltzGen's own default, already cached on this host.
    example: "huggingface:boltzgen/inference-data:mols.zip"
  num_workers:
    type: integer
    minimum: 0
    maximum: 32
    default: 1
    description: >-
      DataLoader worker process count. 1 is a safe default for a single
      interactive call; raise it only if data loading, not GPU compute, is
      the bottleneck.
    example: 1
