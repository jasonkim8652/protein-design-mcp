name: run_genie3_binder
category: binder_generation
composite: false
timeout_s: 7200

engine:
  repo: genie3
  # `genie2_fixed`, not `genie2`: a clone of the original environment (see
  # this wave's report, wave-I) with Biopython installed via the clone's
  # own bin/pip -- never `conda activate`, and the original `genie2` env
  # was never modified (confirmed live: different inodes, `import Bio`
  # still fails there). This is what makes `expand_interface: true` below
  # possible: `compute_extended_interface` needs `Bio.PDB`.
  prefix: /home/jk661/.conda/envs/genie2_fixed
  entry: ["python", "/app/scripts/engines/genie3_binder.py"]
  env_vars:
    PYTHONPATH: /home/jk661/projects/genie3/.deps:/home/jk661/projects/genie3/src
  # `discover_mounts(prefix, "genie3", env=env_vars)` (confirmed live
  # against genie2_fixed) resolves only to genie3/src/genie3 -- see
  # run_genie3_scaffold.yaml's identical mounts comment for the full
  # reasoning (same engine, same PYTHONPATH).
  mounts:
    - /home/jk661/projects/genie3
    - /home/jk661/projects/genie3/src/genie3

requires:
  gpu: true

outputs:
  - name: binders
    pattern: "output/target/pdbs/*.pdb"
    description: >-
      One PDB per generated sample, containing the FULL COMPLEX -- the
      generated binder chain (always chain A; note that run_rfdiffusion2 and
      run_protpardelle put their design in chain B instead, so an assumption
      carried between generators will be wrong) plus the target chain(s)
      from target_pdb, unchanged. The generated chain is BACKBONE ONLY: it
      comes back as UNK residues with CA atoms only, carrying no sequence at
      all. Confirmed by reading a real run's output, 2026-09-23. That also
      means tools which select "protein" residues do not see it -- ProDy,
      and therefore run_mpnn, skip a UNK/CA-only chain entirely. Run
      run_rebuild_backbone on this file first: it reconstructs N, C and O
      from the CA trace and renames UNK, after which run_mpnn designs the
      chain normally. The order is
      run_genie3_binder -> run_rebuild_backbone -> run_mpnn.
    multiple: true
  - name: interface_conditioning
    pattern: interface_conditioning.json
    description: >-
      Always written (regardless of expand_interface): cond_strategy used,
      the hotspot_residues you supplied, and extended_interface_residues
      (null unless expand_interface was true). Same data as the tool's own
      cond_strategy / extended_interface_residues reply fields.

summary: >-
  Generate a binder against a target with Genie 3's all-atom
  SE(3)-equivariant diffusion model, conditioned on a target structure and
  hotspot residues you supply directly (MSA-free by construction -- Genie 3
  never reads an alignment during generation, only during evaluation/reward
  steps this tool does not expose). Conditions on exactly the hotspot
  residues you supply by default; set expand_interface: true to instead
  condition on Genie 3's own SASA-based "extended interface" (surface
  residues near your hotspots), now available on this host.

doc: |
  ## What this is
  Genie 3's target-conditioned binder-design generation path
  (`genie3.cli generate`, dataset source `target`): given a target structure
  and a set of hotspot residues on it, samples a new chain's coordinates
  conditioned on that interface. Backbone frames only -- see "What is NOT
  exposed" for why the side-chain stage is unreachable here.

  ## `target_pdb` and `hotspot_residues` -- the parameters that decide whether this tool is usable at all
  `target_pdb` is a structure file containing ONLY the target (one or more
  chains) -- no existing binder chain. `hotspot_residues` is a list of
  `{chain_id}{residue_index}` tags picking specific residues ON THAT
  STRUCTURE to condition the binder against, e.g. `["A19", "A76", "A80"]`
  for chain A residues 19, 76 and 80 (an optional trailing insertion-code
  letter is also accepted, e.g. `"A113A"`). These are read directly from
  Genie 3's own `parse_hotspot_tags` grammar (`genie3/generation/utils/
  interface/extended.py`, read from source) -- a malformed tag like `"19"`
  (no chain) or `"chainA19"` is rejected by THIS tool's own schema pattern
  before it ever reaches the engine, rather than failing deep inside a
  subprocess.

  ## `expand_interface` -- exact hotspots (default) vs. Genie 3's own extended interface
  By default (`expand_interface: false`) this tool conditions on EXACTLY the
  hotspot residues you supply (`cond_strategy: "hotspot"`, Genie 3's own
  literal, unexpanded interface definition) -- not a larger neighborhood.
  Genie 3's own binder-design pipeline (`scripts/problem/binder_design/
  prepare.py`) normally also computes an "extended interface" -- surface
  residues near each hotspot, via a Shrake-Rupley solvent-accessible-surface
  calculation (`genie3.generation.utils.interface.extended
  .compute_extended_interface`, which needs `Bio.PDB`). That is now
  available here too: set `expand_interface: true` to run the exact same
  computation `prepare.py` runs (`version_num=1`, so your literal hotspots
  are always folded into the expanded set too) and condition on the result
  instead (`cond_strategy: "extended"`). Confirmed live against a real
  target (108-residue barnase, 3 real interface hotspots): expanded to 16
  surface residues within `interface_cutoff_angstrom` of any hotspot atom.
  `interface_cutoff_angstrom`, `interface_rsa_threshold` and
  `interface_abs_sasa_threshold` are `compute_extended_interface`'s own
  tunable knobs, exposed here rather than hardcoded; all three are ignored
  when `expand_interface` is false. The reply's `cond_strategy` and
  `extended_interface_residues` (also written to the `interface_conditioning`
  output on every call) report exactly what was used, so this is never
  silent about which mode ran. If your target has a known broader interface
  you want conditioned on exactly, supply every residue in it directly as
  `hotspot_residues` instead of using `expand_interface`.

  ## MSA -- never built, confirmed from source
  `target_msa_filepath` (which Genie 3's own `prepare.py` builds via
  `colabfold_batch`) is read ONLY by evaluation/reward code
  (`genie3/evaluation/model/fold/*.py`, `genie3/generation/diffusion/
  reward/colabfold.py`'s `mode: "msa"` reward path) -- confirmed by reading
  every reference to it in the codebase. Core generation
  (`create_np_features_from_target_config`, what this tool actually calls)
  never reads it. This tool therefore never builds an alignment at all,
  which is also why it never contacts a remote MSA server with a target
  sequence that may be under embargo.

  ## When to use this instead of the alternatives
  - `run_protpardelle` is the direct sibling -- another target-conditioned
    binder generator, using RFdiffusion-style contig strings instead of a
    target-PDB-plus-hotspots JSON problem, and a materially different
    (non-latent-diffusion) architecture.
  - Neither this tool nor `run_protpardelle` scores the result. Refold with
    `run_chai1` or `run_boltz` with the target chain present, then score
    the interface with `run_ipsae`.
  - Design a sequence for the binder if you need one -- this tool emits
    backbone frames, so fold the result and run `run_mpnn` on it.

  ## What is NOT exposed, and why
  - **`predict_sequence`** is fixed to `false` -- sequence design is
    `run_mpnn`'s job, the same rule as every other generative tool here.
  - **`predict_sidechain`** is not exposed, although `run_genie3_scaffold`
    does expose it. Genie 3's side-chain pass is a second stage guarded by
    `assert config.dataset.source == "unconditional"`
    (`genie3/generation/workflow.py`), and binder generation runs with
    `source == "target"` (`runner.py`, `postprocess.py`), so the assertion can
    never hold here. The guard sits AFTER `[1 / 2] Main stage completed!`, so
    setting it would run the whole generation and then discard it -- confirmed
    live, 52 s of GPU lost to an AssertionError. Fold the backbone and run
    `run_mpnn` for an all-atom model instead.
  - **Multi-round / iterative binder design** (Genie 3's own
    `cond_strategy: iter_common`, which recomputes an interface from prior
    rounds' successes) is an orchestration pattern over several calls to
    this same generation step, not a single generation call -- out of scope
    for one tool invocation.
  - **Beam search / reward-guided sampling** (`generation.inference.search`)
    is not exposed -- it requires ColabFold (the `colabfold` reward mode) or
    other scoring machinery this tool does not run; score candidates
    yourself afterward instead.

  ## What you must supply
  `target_pdb`, `hotspot_residues`, `binder_min_length`, `binder_max_length`
  -- every one of these defines the design task itself and has no safe
  default.

  ## What you get back
  `binders`: one entry per generated PDB, each `{"id", "length",
  "binder_chain_id", "chain_lengths"}`. Each PDB holds the FULL COMPLEX
  (see the `outputs:` note above) -- `length` and `binder_chain_id` name
  ONLY the generated binder chain specifically (confirmed live: Genie 3
  always writes it as the file's first chain, since
  `create_np_features_from_target_config` concatenates the binder's
  features before the target's, read from source); `chain_lengths` gives
  every chain's own length, target included, so you can verify what stayed
  fixed yourself rather than trust this description. `num_binders`,
  `cond_strategy` (`"hotspot"` or `"extended"` -- which one actually ran),
  `extended_interface_residues` (null unless `expand_interface` was true,
  else the expanded tag list actually conditioned on), and under `outputs`
  the path to every generated PDB plus `interface_conditioning` (the same
  conditioning data as a file).

schema:
  target_pdb:
    type: string
    format: path
    pattern: '\.(pdb|cif)$'
    required: true
    description: >-
      Structure file containing ONLY the target (one or more chains, no
      existing binder chain). hotspot_residues below refer to this file's
      own chain identifiers and residue numbers.

      WHERE THIS COMES FROM -- The target you want a binder against -- your
      own structure file, or a path a previous step returned. Target ONLY,
      with no existing binder chain.
    example: target.pdb
  hotspot_residues:
    type: array
    items:
      type: string
      pattern: '^[A-Za-z]\d+[A-Za-z]?$'
    minItems: 1
    maxItems: 50
    required: true
    description: >-
      Residues on target_pdb to condition the binder against, each
      "{chain_id}{residue_index}" (optionally with a trailing insertion-code
      letter), e.g. "A19". Used exactly as given -- see the doc for why this
      tool does not expand them into a larger interface. A malformed tag
      (missing chain, non-numeric residue index) is rejected here rather
      than failing inside the engine.
    example: ["A19", "A76", "A80", "A82"]
  binder_min_length:
    type: integer
    minimum: 5
    maximum: 300
    required: true
    description: >-
      Shortest binder chain length to sample, inclusive. Every sample's
      length is drawn uniformly from [binder_min_length, binder_max_length]
      independently.
    example: 60
  binder_max_length:
    type: integer
    minimum: 5
    maximum: 300
    required: true
    description: >-
      Longest binder chain length to sample, inclusive. Set equal to
      binder_min_length to fix a single length.
    example: 90
  num_samples:
    type: integer
    minimum: 1
    maximum: 200
    default: 2
    description: Total number of binder samples to draw against this target.
    example: 2
  model_variant:
    type: string
    enum: ["v1", "legacy"]
    default: v1
    description: >-
      Which trained checkpoint and sampler to use -- see run_genie3_scaffold's
      doc for what each variant is (identical checkpoints, same tradeoffs).
      `legacy` ignores every DDIM-only parameter below.
    example: v1
  direction_scale:
    type: number
    minimum: 0.0
    maximum: 5.0
    default: 1.0
    description: >-
      DDIM sampler only (ignored for model_variant=legacy). Scales the
      predicted denoising direction at each step; Genie 3's own config
      requires an explicit value (no shipped default).
    example: 1.0
  eta:
    type: number
    minimum: 0.0
    maximum: 1.0
    default: 1.0
    description: >-
      DDIM sampler only (ignored for model_variant=legacy). Stochasticity: 0
      is deterministic (ODE-like), 1 is DDPM-equivalent stochastic sampling.
      Genie 3's own default is 1.0.
    example: 1.0
  n_sample_step:
    type: integer
    minimum: 1
    maximum: 1000
    default: 100
    description: >-
      DDIM sampler only (ignored for model_variant=legacy). Number of
      denoising steps out of the model's fixed 1000-step training schedule.
      Genie 3's own default is 100; more steps is finer-grained at roughly
      linear cost.
    example: 100
  noise_scale:
    type: number
    minimum: 0.0
    maximum: 2.0
    default: 1.0
    description: >-
      Scales injected noise at each denoising step. Applies to both
      samplers. Genie 3's own default is 1.0 for both.
    example: 1.0
  seed:
    type: integer
    minimum: 0
    default: 0
    description: >-
      Random seed for the diffusion trajectory. Two runs with the same seed
      and the same parameters return the same backbones, so change it to
      sample a different set rather than re-running and expecting variety.
      It does not affect quality, only which samples you get.
    example: 0
  expand_interface:
    type: boolean
    default: false
    description: >-
      false (the default) conditions on EXACTLY hotspot_residues, unchanged
      from this tool's original behavior. true runs Genie 3's own
      SASA-based "extended interface" expansion (compute_extended_interface,
      confirmed live -- see the doc) and conditions on that larger surface
      patch instead; your literal hotspots are always included in it too.
      Use this when you have a few known hotspots but want the binder to
      also engage the surrounding surface, rather than only the exact
      residues you named.
    example: false
  interface_cutoff_angstrom:
    type: number
    minimum: 1.0
    maximum: 20.0
    default: 6.0
    description: >-
      Ignored unless expand_interface is true. A surface residue is
      included in the expanded interface if any of its heavy atoms is
      within this distance of any heavy atom of a hotspot residue.
      compute_extended_interface's own default is 6.0.
    example: 6.0
  interface_rsa_threshold:
    type: number
    minimum: 0.0
    maximum: 1.0
    default: 0.25
    description: >-
      Ignored unless expand_interface is true. Relative solvent
      accessibility above which a residue counts as "surface" and is
      eligible for the expanded interface at all (a buried residue within
      interface_cutoff_angstrom is still excluded). compute_extended_interface's
      own default is 0.25.
    example: 0.25
  interface_abs_sasa_threshold:
    type: number
    minimum: 0.0
    maximum: 300.0
    default: 10.0
    description: >-
      Ignored unless expand_interface is true. Absolute SASA (Angstroms^2)
      floor used alongside interface_rsa_threshold in the same surface
      classification. compute_extended_interface's own default is 10.0.
    example: 10.0
