name: run_ipsae
category: scoring
composite: false
timeout_s: 300

engine:
  repo: ipsae
  env: scoring
  entry: ["ipsae"]
  # ipsae (PyPI ipsae==1.0.1, its only entry point is ipsae.cli:main) always
  # writes its three output files next to the STRUCTURE file it was given —
  # its CLI has no flag to redirect that. `structure` is `format: path`, so
  # by the time this tool's argv is built it has already been resolved to
  # an absolute path (see app._resolve_path_params), which is outside the
  # dispatcher's scratch working directory — so without staging, ipSAE's
  # outputs would land outside the scratch dir too, unreachable by the
  # `outputs:` pattern below. Staging `structure` into the scratch dir
  # first (see manifest.schema.EngineSpec.stage / protein_design_mcp.staging)
  # makes "beside the input" mean "inside the scratch dir".
  stage: ["structure"]

requires:
  gpu: false

outputs:
  # ipsae's _save_outputs writes BOTH `{stem}_{pae}_{dist}.txt` (the table
  # this adapter reads) and `{stem}_{pae}_{dist}_byres.txt` next to the
  # (now-staged) structure file; pae_cutoff/dist_cutoff are caller-supplied
  # so neither suffix can be pinned into a static glob, and no glob syntax
  # distinguishes "ends in _byres.txt" from "does not". `multiple: true`
  # collects both; the adapter picks the right one by its header row (the
  # by-residue file's columns never satisfy the required-column check), not
  # by filename.
  - name: results_txt
    pattern: "structure/*.txt"
    description: ipSAE's per-chain-pair results table, plus its by-residue detail file.
    multiple: true

summary: >-
  Score how confident a structure predictor was about a protein-protein
  interface, from the PAE matrix it already produced (ipSAE). This is the
  field's standard discriminator between real and spurious binders and is the
  metric to rank designs by. It scores a prediction you already have: run a
  co-folding tool first and feed this its PAE output.

doc: |
  ## What this is
  ipSAE (interface Score from Aligned Errors) reads a structure predictor's
  predicted aligned error matrix and returns a per-chain-pair confidence in the
  interface itself, rather than in the fold as a whole.

  ## What it is for
  Ranking designed binders. Benchmarking across AF2-IG, Boltz-1, Boltz-2,
  Chai-1, ColabFold and Protenix found ipSAE roughly 1.4x more precise than
  ipTM at separating true binders from non-binders, and it remains the field
  standard as of late 2026.

  ## When to use this instead of the alternatives
  - `run_prodigy` returns an absolute binding free energy on a physical scale,
    but is calibrated on natural complexes and mis-ranks de novo designs. Use
    PRODIGY for a sanity floor, ipSAE for ranking.
  - The raw `iptm` a co-folding tool reports is the older, less precise form of
    the same idea. Prefer ipSAE when you have the PAE matrix.
  - ipSAE tells you nothing about the physics of the interface. For buried
    surface area, hydrogen bonds and shape complementarity you need a
    physics-based interface analysis, which is not yet implemented here.

  ## What you must supply
  The PAE JSON a predictor emitted, and the structure it goes with.

  ## What you get back
  `ipsae`, `iptm_af`, `pdockq` and the `chain_pair` they describe, and under
  `outputs` the paths to `results_txt` — ipSAE's own results table plus its
  by-residue detail file, both collected as a list. ipSAE emits one row per
  chain pair; for a complex with more than two chains, only the first chain-pair row
  is returned, with no indication of which pair that is beyond `chain_pair`
  itself. Score the specific pair you care about by supplying a
  structure/PAE containing only those two chains.

schema:
  pae_file:
    type: string
    format: path
    pattern: '\.(json|npz)$'
    required: true
    description: >-
      The predicted-aligned-error matrix from the structure predictor that
      produced `structure`. WHICH FILE depends on the predictor, and they are
      not interchangeable formats: `run_alphafold2_multimer` writes a
      `.json` (its `pae_json` output), `run_boltz` writes a `.npz` (its
      `pae_npz` output), and Chai-1 writes its `full_data_*.json`. All three
      combinations are listed in ipSAE's own CLI help and handled by its
      `core.py`; this parameter used to be called `pae_json` and reject
      anything but `.json`, which refused Boltz's PAE even though
      run_boltz's own output says it is "for run_ipsae".

      A `.npz` must stay BESIDE its confidence file. ipSAE does not take the
      summary as an argument -- it derives the path by replacing "pae" with
      "confidence" and ".npz" with ".json" in this one -- so a PAE copied away
      from its sibling fails on a file you never named. Pass the path
      run_boltz returned rather than a copy.

      `structure` must contain AT LEAST TWO CHAINS. ipSAE scores the
      interface between a chain pair, so a monomer gives it nothing to score
      -- and it does not say so: on a single-chain prediction it dies with
      `cannot access local variable 'n0res_byres_all'`, which names nothing a
      caller can act on. Fold with the target present before scoring.
    example: pae_model_0.npz
  structure:
    type: string
    format: path
    pattern: '\.(pdb|cif)$'
    required: true
    description: The predicted structure the PAE matrix belongs to.
    example: model.cif
  pae_cutoff:
    type: number
    minimum: 1.0
    maximum: 30.0
    default: 10.0
    description: PAE cutoff in Angstroms.
    example: 10.0
  dist_cutoff:
    type: number
    minimum: 1.0
    maximum: 30.0
    default: 10.0
    description: Distance cutoff in Angstroms.
    example: 10.0
